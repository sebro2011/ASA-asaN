name: Verify

# There was no CI before this workflow: 67 test suites and a 819-test run were
# claims made by whoever last typed `npm test`. This makes them a gate.
#
# Deliberately no secrets and no deploy step — it can run on pull requests from
# forks, and it cannot touch production.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      # api/index.js is committed and is exactly what Vercel executes. If it can
      # drift from server/ then a deploy can silently run old server code while
      # the tests above pass against new source.
      - name: Server bundle is in sync with its source
        run: |
          npm run build:api
          if ! git diff --quiet -- api/index.js; then
            echo "::error::api/index.js is out of date. Run 'npm run build:api' and commit the result."
            git --no-pager diff --stat -- api/index.js
            exit 1
          fi

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
