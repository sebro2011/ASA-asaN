<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Deep Space Gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Distant Stars Background -->
  <circle cx="80" cy="90" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="430" cy="110" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="410" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="440" cy="390" r="3" fill="#f43f5e" opacity="0.8" />
  <circle cx="210" cy="70" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="340" cy="450" r="2" fill="#38bdf8" opacity="0.8" />

  <!-- Elliptical Planetary Orbit Ring -->
  <ellipse cx="256" cy="256" rx="190" ry="75" fill="none" stroke="url(#orbitGrad)" stroke-width="8" stroke-dasharray="8 6" transform="rotate(-28 256 256)" filter="url(#glow)" />

  <!-- Central Planet Earth / Deep Space Globe -->
  <circle cx="256" cy="256" r="88" fill="url(#planetGrad)" filter="url(#glow)" />

  <!-- Atmosphere Rim Lighting -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.85" />

  <!-- Red NASA Vector Chevron -->
  <path d="M 170 320 Q 256 160 350 200 L 330 225 Q 260 195 195 335 Z" fill="#f43f5e" filter="url(#glow)" />

  <!-- Orbiting Mini Satellite / Craft -->
  <circle cx="395" cy="185" r="9" fill="#ffffff" filter="url(#glow)" />
  <circle cx="395" cy="185" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
</svg>
