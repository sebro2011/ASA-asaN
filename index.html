<!doctype html>
<html lang="en" data-nova-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NOVA AI — AI assistant &amp; productivity workspace</title>
    <meta
      name="description"
      content="NOVA AI is a trilingual AI workspace for chat, projects, documents, research and tasks — with the complete NASA science explorer (APOD, Earth Intelligence Lab, missions and more) built in."
    />
    <meta property="og:title" content="NOVA AI — AI assistant &amp; productivity workspace" />
    <meta
      property="og:description"
      content="Chat, projects, documents, research, code and tasks in one trilingual workspace — plus the full NASA science explorer."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:alt" content="NASA Space Explorer — discover, explore, learn" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA AI — AI assistant &amp; productivity workspace" />
    <meta name="twitter:description" content="One workspace for AI chat, documents, research and tasks — in English, Sinhala and Tamil." />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <meta name="theme-color" content="#08090D" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* Theme boot: resolve the stored preference before first paint so the
         workspace never flashes the wrong palette. Mirrors src/app/theme.ts. */
      (function () {
        try {
          var stored = localStorage.getItem('nova_theme') || 'system';
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-nova-theme', theme);
          if (localStorage.getItem('nova_motion') === 'reduced') {
            document.documentElement.setAttribute('data-nova-motion', 'reduced');
          }
          if (localStorage.getItem('nova_contrast') === 'high') {
            document.documentElement.setAttribute('data-nova-contrast', 'high');
          }
        } catch (e) {
          /* storage blocked: the dark default is already on <html> */
        }
      })();
    </script>
  </head>
  <body class="bg-void text-ink antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f7ff; background: #08090d">
        NOVA AI renders in the browser and needs JavaScript. The underlying NASA services and the
        source of this application remain available without it.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
