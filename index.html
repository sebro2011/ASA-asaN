<!doctype html>
<html lang="en" data-nova-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NASA Space Explorer — Earth, missions &amp; deep space</title>
    <meta
      name="description"
      content="NASA imagery, Earth intelligence, asteroid tracking, mission archives and deep-space 3D — with the NOVA astronomy assistant built in. Available in English, Sinhala and Tamil."
    />
    <meta property="og:title" content="NASA Space Explorer — Earth, missions &amp; deep space" />
    <meta
      property="og:description"
      content="Earth · Missions · Deep Space — with the NOVA astronomy assistant."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:alt" content="NASA Space Explorer — discover, explore, learn" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NASA Space Explorer — Earth, missions &amp; deep space" />
    <meta name="twitter:description" content="Earth · Missions · Deep Space — with the NOVA astronomy assistant, in English, Sinhala and Tamil." />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <meta name="theme-color" content="#08090D" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Space Explorer" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Blocking, same-origin: runs before <body> is parsed, so the theme is
         already resolved at first paint. No inline script means the CSP can
         drop 'unsafe-inline' from script-src. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body class="bg-void text-ink antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f7ff; background: #08090d">
        NOVA AI renders in the browser and needs JavaScript. The underlying NASA services and the
        source of this application remain available without it.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
