    <script>
      // Defensive polyfill protection for window.fetch getter/setter in strict sandboxes
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // Ignore harmless Vite HMR WebSocket connection messages in sandbox
            window.addEventListener('error', function(event) {
              if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('websocket'))) {
                event.stopImmediatePropagation();
              }
            });

            var _activeFetch = window.fetch ? window.fetch.bind(window) : null;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _activeFetch; },
                set: function(fn) { _activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              try {
                window.fetch = _activeFetch;
              } catch (_) {}
            }
          }
        } catch (err) {}
      })();
    </script>
