              fullMsg.indexOf('websocket') !== -1 ||
              fullMsg.indexOf('closed without opened') !== -1 ||
              fullMsg.indexOf('failed to connect to websocket') !== -1 ||
              fullMsg.indexOf('request timeout') !== -1 ||
              fullMsg.indexOf('aborterror') !== -1 ||
              fullMsg.indexOf('aborted') !== -1

            }

          };

          var origConsoleWarn = console.warn;
          console.warn = function() {
            var fullMsg = Array.prototype.slice.call(arguments).map(function(arg) {
              return (arg && (arg.message || arg.stack || arg.toString())) || '' + arg;
            }).join(' ').toLowerCase();

            if (
              fullMsg.indexOf('websocket') !== -1 ||
              fullMsg.indexOf('closed without opened') !== -1 ||
              fullMsg.indexOf('failed to connect to websocket') !== -1
            ) {

          };

        // 2. Immediately intercept and suppress benign AbortError, timeout, and WebSocket rejections

            var str = String(reason || '').toLowerCase();
            if (
              str.indexOf('websocket') !== -1 || 
              str.indexOf('closed without opened') !== -1 ||
              str.indexOf('aborted') !== -1 ||
              str.indexOf('aborterror') !== -1 ||
              str.indexOf('timeout') !== -1 ||
              str.indexOf('request timeout') !== -1

        }, true);

        window.addEventListener('error', function(event) {
          try {
            var msg = (event && (event.message || '')) + (event && (event.filename || ''));
            var str = String(msg || '').toLowerCase();
            if (
              str.indexOf('websocket') !== -1 ||

              str.indexOf('aborted') !== -1 ||
              str.indexOf('aborterror') !== -1 ||
              str.indexOf('timeout') !== -1 ||

        // 3. Defensive mock for Vite HMR WebSocket in environments where HMR is disabled
        try {

            var isViteHmr = 
              urlStr.indexOf('vite') !== -1 || 
              urlStr.indexOf('localhost') !== -1 || 
              urlStr.indexOf('127.0.0.1') !== -1 || 
              urlStr.indexOf(':3000') !== -1 ||
              (curHost && urlStr.indexOf(curHost) !== -1) ||
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);

            if (isViteHmr) {
              var listeners = {};
              var mockWs = {
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,

                protocol: protocols || '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                close: function() {
                  mockWs.readyState = 3;
                },
                send: function() {},
                addEventListener: function(type, fn) {

                    setTimeout(function() {
                      try { fn({ type: 'open', target: mockWs }); } catch (_) {}
                      if (typeof mockWs.onopen === 'function') {
                        try { mockWs.onopen({ type: 'open', target: mockWs }); } catch (_) {}
                      }
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockWs;
            }
            return new RealWebSocket(url, protocols);
          };
          if (RealWebSocket) {
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        try {

            set: function(fn) { _activeFetch = fn; },
            configurable: true,
